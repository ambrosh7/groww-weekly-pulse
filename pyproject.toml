[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "groww-weekly-pulse"
version = "0.1.0"
description = "Weekly Play Store review pulse for Groww — Docs + Gmail via MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "google-play-scraper>=1.2.7",
  "langdetect>=1.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
groww-pulse = "src.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
